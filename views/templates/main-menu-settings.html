<div>
    <div class="settings-back-button-container">
        <a href="#" id="settings-back-button" class="settings-back-button" name="cancel">⯇ __MSG_back__</a>
    </div>
    <div class="ppass-divider-light-wide"></div>
    <div class="settings-container">
        <div class="ppass-save-prompt-form-group" name="folder">
            <select id="settings-defaultPasswordFolder" class="ppass-save-prompt-select-list">
                <option value="root">__MSG_retrieving__</option>
            </select>
            <label class="ppass-save-prompt-label ppass-sub-text-1 ppass-grey">__MSG_defaultFolder__</label>
        </div>
        <div class="ppass-save-prompt-form-group" name="serverUrl">
            <input disabled data-value="serverUrl" id="serverUrl" class="ppass-save-prompt-input" type="" placeholder="__MSG_connectedTo__">
            <label class="ppass-save-prompt-label ppass-sub-text-1 ppass-grey">__MSG_connectedTo__</label>
        </div>
        <div class="form-group">
            <div class="ppass-save-prompt-toggle-container">
                <label class="toggle-label ppass-save-prompt-toggle-label">__MSG_autoFillForms__</label>
                <label class="settings-slider ppass-toggle">
                    <input id="settings-autofill" class="" type="checkbox">
                    <span class="ppass-slider"></span>
                </label>
            </div>
            <div class="ppass-save-prompt-toggle-container">
                <label class="toggle-label ppass-save-prompt-toggle-label">__MSG_promptToSavePassword__</label>
                <label class="settings-slider ppass-toggle">
                    <input id="settings-capture" class="" type="checkbox">
                    <span class="ppass-slider"></span>
                </label>
            </div>
            <div class="ppass-save-prompt-toggle-container">
                <label class="toggle-label ppass-save-prompt-toggle-label">__MSG_showFoldersInCredList__</label>
                <label class="settings-slider ppass-toggle">
                    <input id="settings-show-credential-folders" class="" type="checkbox">
                    <span class="ppass-slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>
